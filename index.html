<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1.0,user-scalable=no">
    <title>Funny German Word Quiz</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.jsdelivr.net/npm/js-yaml@4.1.0/dist/js-yaml.min.js"></script>
    
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-2ZHC3664S2"></script>
    <script>
        window.dataLayer = window.dataLayer || [];
        function gtag(){dataLayer.push(arguments);}
        gtag('js', new Date());
        gtag('config', 'G-2ZHC3664S2');
    </script>
</head>
<body>
    <div id="top-banner">
        Multi-Cultural Night 2026 • Burbank Elementary School • Belmont Massachusetts
    </div>
    
    <canvas id="confetti-canvas"></canvas>

    <!-- Step 0: Start Screen -->

    <div id="start-section" class="active">
        <div class="section-content">
            <img src="WordQuizLogo.png" class="logo-img-large">
            <img src="WordQuizKids.png" class="kids-img-large">
            <div id="message-area">Welcome! Ready to learn German words?</div>
            <button id="start-btn" class="big-button">Let's Start!</button>
        </div>
    </div>

    <!-- Step 1-3: Funny German Words Quiz -->
    
    <div id="container" class="hidden">
        <!-- Left Side: Static Logo and Kids -->
        <div id="left-side">
            <img src="WordQuizLogo.png" class="logo-img">
            <img src="WordQuizKids.png" class="kids-img">
        </div>
        
        <!-- Right Side: Dynamic Content -->
        <div id="right-side">
            <!-- Step 1: Wheel Section -->
            <div id="wheel-section" class="hidden">
                <div class="section-content">
                    <div id="wheel-container">
                        <div id="wheel-pointer">▼</div>
                        <canvas id="wheel"></canvas>
                    </div>
                    <div id="message-area">Spin the wheel!</div>
                </div>
                <button id="spin-btn" class="big-button" style="display:none">Spin the Wheel!</button>
            </div>
            
            <!-- Step 2: Pronounce Section -->
            <div id="say-it-section" class="hidden">
                <div class="section-content">
                    <p class="instruction">Now, try to say this word aloud!</p>
                    <h2 id="word-display"></h2>
                    <div id="message-area"></div>
                </div>
                <button id="continue-btn" class="big-button" style="display:none">I Said It! Next</button>
            </div>
            
            <!-- Step 3: Quiz Section -->
            <div id="guess-it-section" class="hidden">
                <div class="section-content">
                    <p class="instruction">What does this word mean?</p>
                    <h2 id="word-display-quiz"></h2>
                    <div id="options-container"></div>
                    <div id="message-area"></div>
                </div>
                <button id="next-btn" class="big-button" style="display:none">Next Word</button>
            </div>
        </div>        
    </div>
    
    <script src="app.js"></script>
</body>
</html>
