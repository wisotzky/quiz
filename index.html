<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1.0,user-scalable=no">
    <title>German Word Quiz</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.jsdelivr.net/npm/js-yaml@4.1.0/dist/js-yaml.min.js"></script>
</head>
<body>
    <div id="top-banner">
        Multi-Cultural Night 2026 • Burbank Elementary School • Belmont Massachusetts
    </div>
    
    <canvas id="confetti-canvas"></canvas>
    
    <div id="container">
        <!-- Shared Left Section -->
        <div id="shared-left">
            <img src="WordQuizLogo.png" class="logo-img hide-on-small">
            <img src="WordQuizKids.png" class="kids-img hide-on-small">
            <div id="message-area"></div>
        </div>
        
        <!-- Step 1: Wheel Section -->
        <div id="wheel-section" class="section active">
            <div class="section-content">
                <div id="wheel-container">
                    <div id="wheel-pointer">▼</div>
                    <canvas id="wheel"></canvas>
                </div>
            </div>
            <div class="bottom-section">
                <button id="spin-btn" class="big-button">Spin the Wheel!</button>
            </div>
        </div>
        
        <!-- Step 2: Pronounce Section -->
        <div id="pronounce-section" class="section">
            <div class="section-content">
                <p class="instruction">Now, try to say this word aloud!</p>
                <h2 id="word-display"></h2>
                <p class="instruction speak-prompt">Take your time and have fun! There's no right or wrong way - this is the best part!</p>
            </div>
            <div class="bottom-section">
                <button id="continue-btn" class="big-button">I Said It! Next</button>
            </div>
        </div>
        
        <!-- Step 3: Quiz Section -->
        <div id="quiz-section" class="section">
            <div class="section-content">
                <p class="instruction">What does this word mean?</p>
                <h2 id="word-display"></h2>
                <div id="options-container"></div>
            </div>
            <div class="bottom-section">
                <button id="next-btn" class="big-button" style="display:none">Next Word</button>
            </div>
        </div>
    </div>
    
    <script src="app.js"></script>
</body>
</html>
