title: German Word Quiz

messages:
  correctAnswer:
    - 🎉 Wunderbar! Awesome!
    - ⭐ Fantastisch! You rock!
    - 🦋 Ausgezeichnet! Perfect!
    - ✨ Super! Amazing job!
    - 🌟 Toll! You did it!
    - 🎊 Großartig! Fantastic!
    - 💪 Perfekt! Well done!
    - 🏆 Spitze! You're a champion!
    - 🎯 Genau richtig! Exactly right!
  wrongAnswer:
    - 😢 Schade! Not quite!
    - 😔 Fast! Almost got it!
    - 😊 Nicht ganz! Not quite right!
    - 😅 Beinahe! Nearly there!
    - 🤔 Versuch's nochmal! Try again!
    - 😬 Ups! Oops, not quite!
    - 💭 Weiter so! Keep going!
    - 🌟 Knapp daneben! So close!
    - 💫 Nicht schlimm! No worries!
    - 🎯 Fast richtig! Almost right!
    - ✨ Probier's nochmal! Give it another try!
    - 🦋 Gute Idee! Good try!
    - 🎈 Das war knapp! That was close!
    - 🌈 Nächstes Mal! Next time!
    - 🎪 Gleich hast du's! You'll get it soon!
    - 💪 Weitermachen! Keep it up!
    - 🏆 Du schaffst das! You can do it!
    - ⭐ Noch einmal! One more time!
    - 🎊 Ganz nah dran! Very close!

