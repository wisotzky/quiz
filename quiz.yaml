title: German Word Quiz

messages:
  correctAnswer:
    - 🎉 Wunderbar! Awesome!
    - ⭐ Fantastisch! You rock!
    - 🦋 Ausgezeichnet! Perfect!
    - ✨ Super! Amazing job!
    - 🌟 Toll! You did it!
